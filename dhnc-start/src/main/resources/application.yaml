server:
  port: ${APP_PORT}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    context-path: ${CONTEXT_PATH}

spring:
  config:
    import: optional:classpath:application-secret.yaml

  application:
    name: ${APP_NAME}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  main:
    lazy-initialization: ${LAZY_INITIALIZATION}

  devtools:
    restart:
      enabled: ${DEVTOOLS_RESTART_ENABLED}

      poll-interval: ${DEVTOOLS_POLL_INTERVAL}
      quiet-period: ${DEVTOOLS_QUIET_PERIOD}

    livereload:
      enabled: ${DEVTOOLS_LIVERELOAD_ENABLED}
  cache:
    type: ${CACHE_TYPE}

    redis:
      time-to-live: ${CACHE_TTL}
      cache-null-values: ${CACHE_NULL_VALUES}

  jpa:
    database-platform: ${JPA_DATABASE_PLATFORM}
    open-in-view: ${JPA_OPEN_IN_VIEW}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

      repositories:
        enabled: ${REDIS_REPOSITORIES_ENABLED}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: ${GOOGLE_SCOPES}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}

          ssl:
            enable: ${MAIL_SSL_ENABLED}

          starttls:
            enable: ${MAIL_STARTTLS_ENABLED}
            required: ${MAIL_STARTTLS_REQUIRED}

          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT}
          timeout: ${MAIL_TIMEOUT}
          writetimeout: ${MAIL_WRITE_TIMEOUT}

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}
    reset-token-expiration: ${JWT_RESET_TOKEN_EXPIRATION}
    issuer: ${JWT_ISSUER}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  cloudinary:
    cloud_name: ${CLOUDINARY_CLOUD_NAME}
    api_key: ${CLOUDINARY_API_KEY}
    api_secret: ${CLOUDINARY_API_SECRET}

  frontend-url: ${FRONTEND_URL}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED}

    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED}

  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS}

  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS}

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      transport: ${OTEL_EXPORTER_OTLP_TRANSPORT:http}

logging:
  level:
    root: ${LOG_LEVEL_ROOT}
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI}
    com.dhnc: ${LOG_LEVEL_APP:INFO}

