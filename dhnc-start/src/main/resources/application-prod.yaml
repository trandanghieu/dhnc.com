management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY_PROD:0.1}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED_PROD:true}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS_PROD:never}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}
    ecs:
      service:
        name: ${spring.application.name}
        version: ${APP_VERSION:unknown}
        environment: ${APP_ENV_PROD:prod}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.dhnc: ${LOG_LEVEL_APP_PROD:INFO}
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
