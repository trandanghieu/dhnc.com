spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

    hikari:
      minimum-idle: ${DB_MIN_IDLE}
      maximum-pool-size: ${DB_POOL_SIZE}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}

    show-sql: ${SHOW_SQL}

    properties:
      hibernate:
        format_sql: ${FORMAT_SQL}
